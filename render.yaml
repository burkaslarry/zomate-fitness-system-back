services:
  - type: web
    name: zomate-fitness-backend
    env: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://zomate-fitness-system-back.onrender.com
      - key: UPLOADS_DIR
        value: /app/uploads
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "10"
      - key: DATABASE_POOL_TIMEOUT
        value: "60"
      - key: DATABASE_POOL_RECYCLE
        value: "300"
      - key: UVICORN_LIMIT_CONCURRENCY
        value: "15"
